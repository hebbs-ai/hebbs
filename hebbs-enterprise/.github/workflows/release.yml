name: Release Enterprise Images

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io

jobs:
  build-engine:
    name: Build & Push Engine Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout hebbs-enterprise
        uses: actions/checkout@v4
        with:
          path: hebbs-enterprise

      - name: Checkout hebbs engine source
        uses: actions/checkout@v4
        with:
          repository: hebbs-ai/hebbs
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          path: hebbs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU for multi-platform builds
        uses: docker/setup-qemu-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CROSS_REPO_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/hebbs-ai/hebbs-engine
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push engine image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: hebbs-enterprise/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=engine
          cache-to: type=gha,mode=max,scope=engine

  build-platform:
    name: Build & Push Platform Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout hebbs-enterprise
        uses: actions/checkout@v4
        with:
          path: hebbs-enterprise

      - name: Checkout hebbs-platform source
        uses: actions/checkout@v4
        with:
          repository: hebbs-ai/hebbs-platform
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          path: hebbs-platform

      - name: Checkout hebbs-dashboard source
        uses: actions/checkout@v4
        with:
          repository: hebbs-ai/hebbs-dashboard
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          path: hebbs-dashboard

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CROSS_REPO_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/hebbs-ai/hebbs-platform
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: hebbs-platform/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=platform
          cache-to: type=gha,mode=max,scope=platform

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [build-engine, build-platform]
    permissions:
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CROSS_REPO_TOKEN }}

      - name: Resolve version tag
        id: version
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Start services
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          export HEBBS_ENGINE_IMAGE="${{ env.REGISTRY }}/hebbs-ai/hebbs-engine:${TAG}"
          export HEBBS_PLATFORM_IMAGE="${{ env.REGISTRY }}/hebbs-ai/hebbs-platform:${TAG}"

          cat > docker-compose.smoke.yml << 'EOF'
          services:
            engine:
              image: ${HEBBS_ENGINE_IMAGE}
              environment:
                - HEBBS_LLM_PROVIDER=openai
                - HEBBS_LLM_API_KEY=sk-test-not-real
                - HEBBS_PANEL_PORT=6381
                - HEBBS_PANEL_BIND_ADDRESS=0.0.0.0
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:6381/api/panel/health"]
                interval: 5s
                timeout: 3s
                retries: 12
                start_period: 30s

            platform:
              image: ${HEBBS_PLATFORM_IMAGE}
              ports:
                - "8080:8080"
              environment:
                - HEBBS_ENGINE_URL=http://engine:6381
                - HEBBS_ENGINE_SOCKET=/data/daemon/daemon.sock
                - HEBBS_DEFAULT_VAULT=/data/vault
                - HEBBS_DB_PATH=/data/platform.db
                - HEBBS_LLM_PROVIDER=openai
                - HEBBS_LLM_API_KEY=sk-test-not-real
              depends_on:
                engine:
                  condition: service_healthy
          EOF

          docker compose -f docker-compose.smoke.yml up -d

      - name: Wait for platform health
        run: |
          echo "Waiting for platform to become ready..."
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              echo "Platform is ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Timed out waiting for platform"
          docker compose -f docker-compose.smoke.yml logs
          exit 1

      - name: Verify health endpoint
        run: |
          curl -sf http://localhost:8080/health
          echo ""
          echo "Health endpoint OK"

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.smoke.yml down -v 2>/dev/null || true
